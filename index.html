<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Dearest Ishu 🥺💖</title>
  
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at 50% 20%, #ffe4e6 0%, #fed7aa 35%, #fbcfe8 100%);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    h1, h2, h3, .font-display {
      font-family: var(--font-display);
    }

    /* Ambient Floating Particles */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      animation: floatUp 8s linear infinite;
      opacity: 0.5;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.65; }
      80% { opacity: 0.65; }
      100% {
        transform: translateY(-10vh) scale(1.1) rotate(360deg);
        opacity: 0;
      }
    }

    /* Cat Realistic Animation Keyframes */
    @keyframes earTwitch {
      0%, 80%, 100% { transform: rotate(0deg); }
      85% { transform: rotate(-5deg); }
      90% { transform: rotate(4deg); }
      95% { transform: rotate(-2deg); }
    }

    @keyframes gentleSway {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }

    @keyframes happyDance {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-16px) rotate(-8deg) scale(1.04); }
      75% { transform: translateY(-16px) rotate(8deg) scale(1.04); }
    }

    @keyframes heartShower {
      0% { transform: translateY(-20px) scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(60px) scale(1.2); opacity: 0; }
    }

    @keyframes begPlead {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(8px) scale(0.97, 1.03); }
    }

    @keyframes kissPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08) translateX(4px); }
    }

    @keyframes faintRoll {
      0% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-25px) rotate(-15deg); }
      70% { transform: translateY(35px) rotate(90deg); }
      100% { transform: translateY(35px) rotate(90deg); }
    }

    @keyframes dizzySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anim-ear { animation: earTwitch 3.6s infinite ease-in-out; transform-origin: 50% 90%; }
    .anim-sway { animation: gentleSway 2.4s infinite ease-in-out; }
    .anim-dance { animation: happyDance 0.8s infinite ease-in-out; }
    .anim-beg { animation: begPlead 1.1s infinite ease-in-out; }
    .anim-kiss { animation: kissPulse 1.2s infinite ease-in-out; }
    .anim-faint { animation: faintRoll 1.4s forwards cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-dizzy { animation: dizzySpin 2s infinite linear; transform-origin: center; }

    /* Sound Bars Animation */
    @keyframes soundBar {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .bar-1 { animation: soundBar 0.8s ease-in-out infinite; }
    .bar-2 { animation: soundBar 0.6s ease-in-out infinite 0.2s; }
    .bar-3 { animation: soundBar 0.9s ease-in-out infinite 0.4s; }

    /* Ultra Soft Glass Container */
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px -15px rgba(244, 114, 182, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.85);
    }

    .coupon-card {
      background: #ffffff;
      border: 2px dashed #f472b6;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .coupon-card:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px -5px rgba(244, 114, 182, 0.3);
    }
    .coupon-card.claimed {
      background: #fdf2f8;
      border-color: #ec4899;
      transform: scale(0.98);
    }

    #btn-runaway {
      position: relative;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 relative">

  <!-- Ambient Floating Background Particles -->
  <div id="ambient-container" class="fixed inset-0 overflow-hidden pointer-events-none"></div>

  <!-- Music & Audio Controller -->
  <div class="fixed top-4 right-4 z-50 flex items-center gap-2">
    <button id="sound-toggle" onclick="toggleAudio()" class="bg-white/95 hover:bg-white text-pink-600 font-bold px-3.5 py-2 rounded-full shadow-lg backdrop-blur flex items-center gap-2 text-xs sm:text-sm transition-all border border-pink-200 hover:scale-105 active:scale-95">
      <div id="sound-bars" class="flex items-end gap-0.5 h-4 w-4 justify-center">
        <span class="w-1 bg-pink-500 rounded-full bar-1"></span>
        <span class="w-1 bg-pink-500 rounded-full bar-2"></span>
        <span class="w-1 bg-pink-500 rounded-full bar-3"></span>
      </div>
      <span id="sound-icon">🎵</span>
      <span id="sound-text">Music: ON</span>
    </button>
  </div>

  <!-- Main Apology Card -->
  <main class="w-full max-w-lg glass-card rounded-[2.5rem] p-6 sm:p-8 text-center relative z-10 transition-all duration-300">
    
    <!-- Stage Progress Indicator & Step Counter -->
    <div class="flex items-center justify-between mb-1 px-1">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-100 text-pink-700 text-xs font-bold tracking-wide">
        <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
        <span id="stage-badge">Apology Mission for Ishu</span>
      </div>
      <span id="round-indicator" class="text-xs font-extrabold text-pink-400 bg-white/80 px-2.5 py-1 rounded-full border border-pink-100 shadow-sm">
        Start
      </span>
    </div>

    <!-- CUTE "YOUR DUMBO" BADGE DIRECTLY ON TOP OF THE CAT -->
    <div class="flex justify-center mt-2 -mb-2 relative z-20">
      <div class="inline-flex items-center gap-1.5 bg-gradient-to-r from-pink-100 via-rose-50 to-pink-100 border border-pink-300/80 text-pink-600 px-3.5 py-1 rounded-full text-xs sm:text-sm font-extrabold tracking-wide shadow-sm hover:scale-105 transition-all">
        <span>🐾</span>
        <span>Your Dumbo</span>
        <span class="text-xs animate-pulse">🥺</span>
      </div>
    </div>

    <!-- Mascot Frame -->
    <div id="mascot-frame" class="w-60 h-60 mx-auto relative flex items-center justify-center my-2 filter drop-shadow-lg">
      <!-- Mascot dynamically injected here -->
    </div>

    <!-- Dialogue Box -->
    <h1 id="stage-title" class="text-2xl sm:text-3xl font-bold text-pink-600 mt-1 mb-2 leading-tight">
      Hey Ishu... 🥺
    </h1>

    <div class="bg-gradient-to-b from-pink-50/90 to-rose-50/60 border border-pink-100/90 rounded-2xl p-4 my-2 shadow-inner">
      <p id="stage-dialogue" class="text-gray-700 text-base sm:text-lg font-medium leading-relaxed">
        Are you still angry with your dumbo?
      </p>
    </div>

    <!-- Interactive Buttons Container -->
    <div id="action-buttons-container" class="mt-4 min-h-[90px] flex items-center justify-center relative">
      <!-- Buttons dynamically injected based on state -->
    </div>

    <p id="footer-hint" class="text-[11px] text-pink-400 mt-4 tracking-wider uppercase font-extrabold">
      Made with 100% remorse & infinite love by your dumbo for Ishu 💌
    </p>
  </main>

  <script>
    /* =========================================================
       1. POWERFUL & AUDIBLE LOUD MUSIC-BOX SOUND ENGINE
       ========================================================= */
    let audioCtx = null;
    let masterGain = null;
    let soundEnabled = true;
    let bgmInterval = null;
    let currentBeat = 0;

    // Sweet Music Box Chord Progression: C -> G -> Am -> F
    const bgmChords = [
      { bass: 261.63, bellNotes: [523.25, 659.25, 783.99, 1046.50] }, // C major
      { bass: 196.00, bellNotes: [493.88, 587.33, 783.99, 987.77] },  // G major
      { bass: 220.00, bellNotes: [440.00, 523.25, 659.25, 880.00] },  // A minor
      { bass: 174.61, bellNotes: [349.23, 440.00, 523.25, 698.46] }   // F major
    ];

    function ensureAudioReady() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.95, audioCtx.currentTime); // LOUD & crisp master volume
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!bgmInterval && soundEnabled) {
        startCuteLullabyLoop();
      }
    }

    function startCuteLullabyLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
      
      // Loops sweet romantic notes every 320ms
      bgmInterval = setInterval(() => {
        if (!soundEnabled || !audioCtx || audioCtx.state === 'suspended') return;

        const chordIndex = Math.floor((currentBeat % 16) / 4);
        const chord = bgmChords[chordIndex];
        const stepInChord = currentBeat % 4;

        // Rich, audible acoustic bass note on beat 1
        if (stepInChord === 0) {
          playMusicBoxTone(chord.bass, 0.70, 0.55, 'triangle');
        }

        // Louder, vibrant chime notes with triangle acoustic harmonics
        const note = chord.bellNotes[stepInChord];
        playMusicBoxTone(note, 0.50, 0.50, 'triangle');

        currentBeat++;
      }, 320);
    }

    function playMusicBoxTone(freq, duration = 0.45, vol = 0.5, type = 'triangle') {
      if (!audioCtx || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // Music Box Pluck Envelope
        noteGain.gain.setValueAtTime(vol, audioCtx.currentTime);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(noteGain);
        noteGain.connect(masterGain);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleAudio() {
      ensureAudioReady();
      soundEnabled = !soundEnabled;

      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      const bars = document.getElementById('sound-bars');

      if (soundEnabled) {
        if (masterGain) masterGain.gain.setValueAtTime(0.95, audioCtx.currentTime);
        icon.textContent = "🎵";
        text.textContent = "Music: ON";
        bars.classList.remove('opacity-20');
        if (!bgmInterval) startCuteLullabyLoop();
      } else {
        if (masterGain) masterGain.gain.setValueAtTime(0.00001, audioCtx.currentTime);
        icon.textContent = "🔇";
        text.textContent = "Music: OFF";
        bars.classList.add('opacity-20');
      }
    }

    /* Sound Effects */
    function playTone(freq, duration = 0.15, type = 'sine', gainVal = 0.35) {
      if (!soundEnabled) return;
      ensureAudioReady();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playKissSound() {
      if (!soundEnabled) return;
      ensureAudioReady();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch(e) {}
    }

    function playFaintThud() {
      if (!soundEnabled) return;
      ensureAudioReady();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch(e) {}
    }

    function playBoing() {
      if (!soundEnabled) return;
      ensureAudioReady();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.22);
      } catch(e) {}
    }

    function playVictoryFanfare() {
      if (!soundEnabled) return;
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((freq, index) => {
        setTimeout(() => playTone(freq, 0.4, 'triangle', 0.35), index * 105);
      });
    }

    /* =========================================================
       2. FLYING EMOJIS BURST ENGINE (FLIES OUT ACROSS SCREEN)
       ========================================================= */
    function burstFlyingEmojis(emojiList, event, count = 35) {
      let originX = window.innerWidth / 2;
      let originY = window.innerHeight / 2;

      if (event && event.currentTarget) {
        const rect = event.currentTarget.getBoundingClientRect();
        originX = rect.left + rect.width / 2;
        originY = rect.top + rect.height / 2;
      }

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fixed pointer-events-none select-none z-50 text-2xl sm:text-4xl';
        el.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
        el.style.left = `${originX}px`;
        el.style.top = `${originY}px`;
        document.body.appendChild(el);

        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 280 + 100;
        const destX = Math.cos(angle) * distance;
        const destY = Math.sin(angle) * distance - (Math.random() * 70 + 30);
        const rot = (Math.random() - 0.5) * 720;
        const duration = Math.random() * 600 + 1100;

        const anim = el.animate([
          { transform: 'translate(-50%, -50%) scale(0.3) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${destX * 0.45}px), calc(-50% + ${destY * 0.45}px)) scale(1.4) rotate(${rot * 0.5}deg)`, opacity: 1, offset: 0.45 },
          { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY + 50}px)) scale(0.85) rotate(${rot}deg)`, opacity: 0 }
        ], {
          duration: duration,
          easing: 'cubic-bezier(0.16, 0.88, 0.32, 1.25)',
          fill: 'forwards'
        });

        anim.onfinish = () => el.remove();
      }
    }

    function initAmbientParticles() {
      const container = document.getElementById('ambient-container');
      const emojis = ['💖', '🌸', '✨', '💕', '🍦', '🧁', '💋', '🎵', '👑'];
      for (let i = 0; i < 22; i++) {
        const span = document.createElement('span');
        span.className = 'heart-particle';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDelay = (Math.random() * 8) + 's';
        span.style.fontSize = (Math.random() * 18 + 14) + 'px';
        container.appendChild(span);
      }
    }

    /* =========================================================
       3. REALISTIC CARTOON MALE HELLO KITTY SVG (NO CAP)
       ========================================================= */

      const hoodieBody = `

      const baseHead = (eyeStyle = "normal") => `
        <g id="pure-kitty-head">
          <g class="anim-ear">

          <g class="anim-ear" style="transform-origin: 204px 86px;">
            <path d="M 204,86 L 232,30 C 237,22 226,12 215,18 L 176,50 Z" fill="url(#rkHeadGrad)" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
            <polygon points="224,30 210,62 188,47" fill="url(#rkEarPink)"/>

          </g>

          <ellipse cx="150" cy="138" rx="68" ry="54" fill="url(#rkHeadGrad)" stroke="#334155" stroke-width="3.5" filter="drop-shadow(0 6px 10px rgba(15, 23, 42, 0.12))"/>

          <ellipse cx="102" cy="154" rx="13" ry="8" fill="url(#rkBlush)"/>
          <ellipse cx="198" cy="154" rx="13" ry="8" fill="url(#rkBlush)"/>

          <g stroke="#334155" stroke-width="3" stroke-linecap="round">
            <line x1="70" y1="134" x2="94" y2="137" />

          </g>

          <ellipse cx="150" cy="148" rx="7" ry="4.8" fill="#facc15" stroke="#78350f" stroke-width="2"/>

              <button onclick="handleTransition('${stages.B6_RAIN}')" class="px-6 py-2.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-display text-sm sm:text-base shadow-md">
                Receive Kiss 💕
              </button>
            </div>
          `;
          break;

        case stages.B6_RAIN:
          roundInd.textContent = "Round 6/6";
          badgeEl.textContent = "Action: Rain Hearts 💖";
          playTone(784, 0.3, 'sine');
          mascotFrame.innerHTML = getCleanMaleKitty('rain_hearts');
          titleEl.textContent = "Look! It's Raining Hearts! 🌧️💖";
          dialogueEl.textContent = "The whole sky is showering pink hearts because Ishu and her dumbo are officially in peace & in love! Ready for your surprise?";

          btnContainer.innerHTML = `
            <div class="flex flex-wrap items-center justify-center gap-3 w-full">
              <button onclick="handleTransition('${stages.FINALE}')" class="px-8 py-3 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-pink-500 hover:scale-105 text-white font-display text-base sm:text-lg shadow-xl">
                Open Apology Treat Box 🎁✨
              </button>
            </div>
          `;
          break;

        /* =========================================================
           GRAND FINALE WITH FLYING EMOJIS & CUSTOM WISH PASS
           ========================================================= */
        case stages.FINALE:
          roundInd.textContent = "Peace! 💖";
          badgeEl.textContent = "🎉 Official Peace Treaty";
          playVictoryFanfare();
          triggerConfettiBurst();
          mascotFrame.innerHTML = getCleanMaleKitty('dance');
          titleEl.textContent = "YAY! Ishu & Her Dumbo Forever! 🥳💖";
          dialogueEl.innerHTML = `
            <span class="block text-pink-600 font-bold mb-1">Thank you for forgiving me, Ishu!</span>
            <span class="text-gray-700">Your dumbo loves you so much! Tap each coupon to claim your treats & wishes:</span>
          `;

          btnContainer.innerHTML = `
            <div class="w-full flex flex-col gap-2.5 text-left my-1">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <!-- 1. LOTS OF KISSES COUPON -->
                <div class="coupon-card p-2.5 rounded-2xl cursor-pointer" onclick="claimCoupon(this, ['💋', '😘', '💖', '💕', '💄', '😽', '❤️', '💋'], event)">
                  <div class="flex items-center gap-2">
                    <span class="text-2xl">💋</span>
                    <div>
                      <h4 class="font-bold text-xs text-gray-800">1x Lots of Kisses & Pecks</h4>
                      <p class="text-[11px] text-pink-500 font-semibold claim-status">Tap to Claim Kisses! 💋</p>
                    </div>
                  </div>
                </div>

                <!-- 2. UNLIMITED ICE CREAM -->
                <div class="coupon-card p-2.5 rounded-2xl cursor-pointer" onclick="claimCoupon(this, ['🍦', '🍨', '🍧', '🍰', '🧁', '🍒', '🍓', '🍦'], event)">
                  <div class="flex items-center gap-2">
                    <span class="text-2xl">🍦</span>
                    <div>
                      <h4 class="font-bold text-xs text-gray-800">1x Unlimited Ice Cream</h4>
                      <p class="text-[11px] text-pink-500 font-semibold claim-status">Tap to Claim! 🍨</p>
                    </div>
                  </div>
                </div>

                <!-- 3. CUDDLES & BACK RUBS -->
                <div class="coupon-card p-2.5 rounded-2xl cursor-pointer" onclick="claimCoupon(this, ['💆‍♀️', '🫂', '🧸', '✨', '🌸', '💖', '🥰', '💆‍♂️'], event)">
                  <div class="flex items-center gap-2">
                    <span class="text-2xl">💆‍♀️</span>
                    <div>
                      <h4 class="font-bold text-xs text-gray-800">1x Cuddles & Back Rubs</h4>
                      <p class="text-[11px] text-pink-500 font-semibold claim-status">Tap to Claim! 🧸</p>
                    </div>
                  </div>
                </div>

                <!-- 4. "WHATEVER ISHU WANTS" PASS (REPLACED MOVIE NIGHT) -->
                <div class="coupon-card p-2.5 rounded-2xl cursor-pointer" onclick="claimCoupon(this, ['👑', '✨', '🎁', '💖', '🪄', '⭐', '🥰', '👑'], event)">
                  <div class="flex items-center gap-2">
                    <span class="text-2xl">👑</span>
                    <div>
                      <h4 class="font-bold text-xs text-gray-800">1x "Whatever Ishu Wants" Pass</h4>
                      <p class="text-[11px] text-pink-500 font-semibold claim-status">Dumbo obeys 1 wish! 🪄✨</p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- UNLIMITED HUGS BUTTON (BURSTS HUGS EVERYWHERE) -->
              <button onclick="redeemUnlimitedHugs(event)" class="w-full mt-2 py-3 bg-gradient-to-r from-pink-500 via-rose-500 to-pink-500 hover:scale-[1.02] active:scale-95 text-white font-display text-base sm:text-lg rounded-2xl shadow-md transition-all flex items-center justify-center gap-2">
                <span>Redeem Unlimited Hugs From Dumbo 🫂💖</span>
              </button>
            </div>
          `;
          break;
      }
    }

    function handleTransition(nextStage) {
      ensureAudioReady();
      playTone(580, 0.1, 'sine');
      renderStage(nextStage);
    }

    function dodgeAngryButton() {
      const btnAngry = document.getElementById('btn-runaway');
      const btnForgive = document.getElementById('btn-growing-forgive');
      if (!btnAngry || !btnForgive) return;

      playBoing();
      runawayCount++;

      const randomX = (Math.random() - 0.5) * 160;
      const randomY = (Math.random() - 0.5) * 70;
      const currentScale = Math.max(0.35, 1 - runawayCount * 0.15);

      btnAngry.style.transform = `translate(${randomX}px, ${randomY}px) scale(${currentScale})`;
      btnAngry.style.opacity = Math.max(0.25, 1 - runawayCount * 0.15);

      const forgiveScale = 1 + (runawayCount * 0.15);
      btnForgive.style.transform = `scale(${Math.min(forgiveScale, 1.35)})`;

      if (runawayCount >= 4) {
        btnAngry.style.display = 'none';
        btnForgive.textContent = "Only Choice: Forgive Your Dumbo! 💖";
      }
    }

    function triggerConfettiBurst() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 85,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#f472b6', '#ec4899', '#fb7185', '#38bdf8', '#fbbf24']
        });
        setTimeout(() => {
          confetti({ particleCount: 45, angle: 60, spread: 50, origin: { x: 0 } });
          confetti({ particleCount: 45, angle: 120, spread: 50, origin: { x: 1 } });
        }, 220);
      }
    }

    function claimCoupon(el, flyingEmojis, event) {
      ensureAudioReady();
      playTone(660, 0.15, 'triangle');
      
      // Burst flying emojis outward from the tapped card across the screen!
      burstFlyingEmojis(flyingEmojis, event, 32);

      el.classList.add('claimed');
      const status = el.querySelector('.claim-status');
      if (status) {
        status.textContent = "REDEEMED! Valid Forever 💖";
        status.classList.replace('text-pink-500', 'text-emerald-600');
      }
      if (typeof confetti === 'function') {
        confetti({ particleCount: 25, spread: 45, origin: { y: 0.7 } });
      }
    }

    function redeemUnlimitedHugs(event) {
      ensureAudioReady();
      playVictoryFanfare();
      triggerConfettiBurst();

      // Huge shower of hug & heart emojis flying across the screen
      burstFlyingEmojis(['🫂', '🤗', '💖', '💕', '🧸', '🌸', '✨', '🥰', '🫂'], event, 45);

      const badge = document.getElementById('stage-badge');
      badge.textContent = "1,000,000 Hugs Sent from Dumbo to Ishu! 🫂✨";
    }

    /* Start audio & music immediately on the first touch or click */
    window.addEventListener('DOMContentLoaded', () => {
      initAmbientParticles();
      renderStage(stages.INITIAL);
      
      const unlockAudio = () => {
        ensureAudioReady();
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };

      window.addEventListener('click', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);
    });
  </script>
</body>
</html>
